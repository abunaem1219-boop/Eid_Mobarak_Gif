<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Mubarak - Special Greeting</title>
    <!-- Google Fonts for English and Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #ffd700;
            --secondary: #ff8c00;
            --bg-color: #0b1021;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0b1021 0%, #1a0b2e 50%, #0b1b2d 100%);
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        /* Audio Control */
        .audio-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .audio-controls:hover {
            transform: scale(1.1);
            background: rgba(255,255,255,0.2);
        }

        /* Glassmorphism Container */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            margin-top: 20px;
            animation: fadeIn 1s ease-out;
        }

        /* Top Image */
        .top-gif {
            width: 100%;
            max-width: 250px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.2);
        }

        /* Greeting Text */
        .greeting-text {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(to right, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite, float 3s ease-in-out infinite;
            background-size: 200% auto;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* Form Elements */
        .input-group {
            margin-bottom: 20px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Custom File Upload */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
        }

        .file-upload-wrapper input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--primary);
            border-radius: 15px;
            color: var(--primary);
            font-weight: 600;
            transition: all 0.3s;
        }

        .custom-file-upload:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .file-name-display {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #aaa;
            display: block;
        }

        /* Action Buttons */
        .btn-generate, .btn-create-own {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }

        .btn-generate {
            background: linear-gradient(45deg, #ff8c00, #ffd700);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.6);
            outline: 2px solid var(--primary);
        }

        .btn-generate:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-create-own {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            box-shadow: 0 0 20px rgba(0, 114, 255, 0.4);
            margin-top: 25px;
            display: none; /* Hidden by default */
        }

        .btn-create-own:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 25px rgba(0, 114, 255, 0.6);
            outline: 2px solid #00c6ff;
        }

        /* Result Section */
        #result-section {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
            animation: slideUp 0.6s ease;
        }

        .result-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin: 0 auto 15px;
            display: none; 
        }

        .result-message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .bengali-text {
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

        /* Share Buttons */
        .share-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #aaa;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .share-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }

        .share-btn:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .btn-whatsapp { background: #25D366; }
        .btn-whatsapp:hover { box-shadow: 0 5px 20px rgba(37, 211, 102, 0.6); }

        .btn-messenger { background: #00B2FF; }
        .btn-messenger:hover { box-shadow: 0 5px 20px rgba(0, 178, 255, 0.6); }

        .btn-telegram { background: #0088cc; }
        .btn-telegram:hover { box-shadow: 0 5px 20px rgba(0, 136, 204, 0.6); }

        .btn-imo { background: #00A3FF; }
        .btn-imo:hover { box-shadow: 0 5px 20px rgba(0, 163, 255, 0.6); }

        .btn-copy { background: #666; }
        .btn-copy:hover { box-shadow: 0 5px 20px rgba(102, 102, 102, 0.6); }

        /* Loader */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
            display: none;
        }
        
        /* System Loader for View Mode */
        #systemLoader {
            display: none;
            margin: 20px 0;
            color: var(--primary);
            font-weight: 600;
        }

        /* Animations */
        @keyframes shine {
            to { background-position: 200% center; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Floating particles effect */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starMove 100s linear infinite;
        }

        @keyframes starMove {
            from { transform: translateY(0); }
            to { transform: translateY(-2000px); }
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3333;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            transition: bottom 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 90%;
        }
        #toast.show { bottom: 20px; }

        /* Ad Container */
        .ad-container {
            margin-top: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <!-- Audio Player (Hidden) & Controls -->
    <audio id="bgAudio" src="song.mp3" loop></audio>
    <div class="audio-controls" id="audioToggle" onclick="window.toggleAudio()">
        <i class="fas fa-volume-mute" id="audioIcon"></i>
    </div>

    <!-- Main Glass Container -->
    <div class="glass-container">
        <!-- Top GIF -->
        <img src="eid.gif" alt="Eid Mubarak GIF" class="top-gif" onerror="this.src='https://c.tenor.com/L5_lAOh6yKkAAAAC/eid-mubarak.gif'">

        <!-- Greeting -->
        <div class="greeting-text">
            ✨ Eid Mubarak! ✨<br>
            <span style="font-size: 1.1rem; font-weight: 600; text-shadow: none; color: #f0f0f0;">নীল আকাশে ঈদ-এর চাঁদ,ঈদের আগে চাঁদনী রাত,ঈদ হল খুশির দিন,দাওয়াত রইলো ঈদের দিন।ভালো থেকো সীমাহীন,ঈদ-এর দিন টা হোক রঙিন।🌺’༉༎* ঈদ মোবারাক*🌺’༉༎</span>
        </div>

        <div id="systemLoader"><i class="fas fa-spinner fa-spin"></i> Loading Greeting...</div>

        <!-- Input Section -->
        <div id="input-section">
            <div class="input-group">
                <input type="text" id="userName" placeholder="Enter Your Name..." autocomplete="off">
            </div>

            <div class="file-upload-wrapper">
                <label for="userPhoto" class="custom-file-upload">
                    <i class="fas fa-camera"></i> Upload Your Photo (Optional)
                </label>
                <input type="file" id="userPhoto" accept="image/*" onchange="window.updateFileName(this)">
                <span class="file-name-display" id="fileName">No file chosen</span>
            </div>

            <button class="btn-generate" id="generateBtn" onclick="window.generateWish()">
                <span class="loader" id="btnLoader"></span>
                <span id="btnText">✨ Generate Eid Wish</span>
            </button>
        </div>

        <!-- Result Section -->
        <div id="result-section">
            <img src="" alt="User Photo" class="result-image" id="displayImage">
            
            <div class="result-message" id="finalMessage"></div>
            
            <div class="bengali-text" id="bengaliMessage"></div>

            <div class="share-title">আপনার বন্ধুদের সাথে শেয়ার করুন 👇</div>
            <div class="share-buttons">
                <a href="#" class="share-btn btn-whatsapp" id="shareWa" target="_blank"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="share-btn btn-messenger" id="shareMs" target="_blank"><i class="fab fa-facebook-messenger"></i></a>
                <a href="#" class="share-btn btn-telegram" id="shareTg" target="_blank"><i class="fab fa-telegram-plane"></i></a>
                <a href="#" class="share-btn btn-imo" id="shareImo"><i class="fas fa-comment"></i></a>
                <button class="share-btn btn-copy" id="copyLinkBtn" title="Copy Link"><i class="fas fa-link"></i></button>
            </div>

            <button class="btn-create-own" id="createOwnBtn" onclick="window.resetToCreate()">
                <i class="fas fa-magic"></i> Create Your Own Greeting
            </button>
        </div>
    </div>

    <!-- Adsterra Ad Container -->
    <div class="ad-container">
        <script type="text/javascript">
            atOptions = {
                'key' : 'aa67b74916611d0d8cffbfa6539409c8',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/aa67b74916611d0d8cffbfa6539409c8/invoke.js"></script>
    </div>

    <!-- Error/Notification Toast -->
    <div id="toast">Error Message</div>

    <!-- Firebase SDK (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const IMGBB_API_KEY = "4eedb6851a7cea2568b20fae037c173c"; 
        
        // Setup Firebase Configuration
        // NOTE: If you are hosting this on Blogger, replace the entire object below with your actual Firebase project settings.
        let firebaseConfig;
if (typeof __firebase_config !== 'undefined') {
    firebaseConfig = JSON.parse(__firebase_config);
} else {
    // ---> Blogger Users: PUT YOUR FIREBASE CONFIG HERE <---
    firebaseConfig = { // <-- এখান থেকে const সরিয়ে দেওয়া হয়েছে
        apiKey: "AIzaSyDu3QpAju7X-tKPLbG9S-wL9ZjUJj3ShrE",
        authDomain: "eid-mobarak-3c22b.firebaseapp.com",
        projectId: "eid-mobarak-3c22b",
        storageBucket: "eid-mobarak-3c22b.firebasestorage.app",
        messagingSenderId: "1094480325564",
        appId: "1:1094480325564:web:a8388104289a4e277a59b9"
    };
}
const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'eid-viral-app';

        // --- DOM Elements ---
        const bgAudio = document.getElementById('bgAudio');
        const audioIcon = document.getElementById('audioIcon');
        const userNameInput = document.getElementById('userName');
        const userPhotoInput = document.getElementById('userPhoto');
        const fileNameDisplay = document.getElementById('fileName');
        const generateBtn = document.getElementById('generateBtn');
        const btnLoader = document.getElementById('btnLoader');
        const btnText = document.getElementById('btnText');
        const resultSection = document.getElementById('result-section');
        const inputSection = document.getElementById('input-section');
        const displayImage = document.getElementById('displayImage');
        const finalMessage = document.getElementById('finalMessage');
        const bengaliMessage = document.getElementById('bengaliMessage');
        const toast = document.getElementById('toast');
        const systemLoader = document.getElementById('systemLoader');
        const createOwnBtn = document.getElementById('createOwnBtn');

        // --- Audio Logic ---
        let isAudioPlaying = false;
        document.body.addEventListener('click', function initAudio() {
            if (!isAudioPlaying) {
                bgAudio.play().then(() => {
                    isAudioPlaying = true;
                    audioIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
                }).catch((e) => console.log("Autoplay prevented by browser"));
            }
            document.body.removeEventListener('click', initAudio);
        });

        window.toggleAudio = function() {
            if (bgAudio.paused) {
                bgAudio.play();
                audioIcon.classList.replace('fa-volume-mute', 'fa-volume-up');
                isAudioPlaying = true;
            } else {
                bgAudio.pause();
                audioIcon.classList.replace('fa-volume-up', 'fa-volume-mute');
                isAudioPlaying = false;
            }
        };

        // --- UI Utils ---
        window.updateFileName = function(input) {
            if (input.files && input.files.length > 0) {
                fileNameDisplay.textContent = input.files[0].name;
                fileNameDisplay.style.color = "#ffd700";
            } else {
                fileNameDisplay.textContent = "No file chosen";
                fileNameDisplay.style.color = "#aaa";
            }
        };

        function showToast(msg, isSuccess = false) {
            toast.textContent = msg;
            toast.style.background = isSuccess ? "#25D366" : "#ff3333";
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Initialization & Routing ---
        async function initializeSystem() {
            try {
                // Must authenticate first to read/write to DB
                await signInAnonymously(auth);
                
                // Check if user is visiting a shared link
                const urlParams = new URLSearchParams(window.location.search);
                const eid = urlParams.get('eid');

                if (eid) {
                    inputSection.style.display = 'none';
                    systemLoader.style.display = 'block';
                    await loadGreeting(eid);
                } else {
                    inputSection.style.display = 'block';
                    systemLoader.style.display = 'none';
                }
            } catch (error) {
                console.error("Initialization Error:", error);
                showToast("Assalamualykum");
                inputSection.style.display = 'block';
            }
        }

        async function loadGreeting(eid) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'eidGreetings', eid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    setupResult(data.name, data.imageUrl, eid, true);
                } else {
                    showToast("Greeting not found! Create your own.");
                    window.resetToCreate();
                }
            } catch (error) {
                showToast("Error loading greeting.");
                window.resetToCreate();
            } finally {
                systemLoader.style.display = 'none';
            }
        }

        // Run Init
        initializeSystem();

        // --- Logic: Image Upload API ---
        async function uploadToImgBB(file) {
            if(!IMGBB_API_KEY) {
                throw new Error("ImgBB API Key is missing!");
            }
            const formData = new FormData();
            formData.append('image', file);
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    return data.data.url;
                } else {
                    throw new Error(data.error.message || "Image upload failed");
                }
            } catch (error) {
                throw error;
            }
        }

        // --- Logic: Save to Firebase ---
        async function saveToDatabase(name, imageUrl) {
            const greetingsRef = collection(db, 'artifacts', appId, 'public', 'data', 'eidGreetings');
            const newDocRef = doc(greetingsRef); // Automatically generates unique ID
            await setDoc(newDocRef, {
                name: name,
                imageUrl: imageUrl || null,
                createdAt: serverTimestamp()
            });
            return newDocRef.id;
        }

        // --- Logic: Generate Button Action ---
        window.generateWish = async function() {
            const name = userNameInput.value.trim();
            if (!name) {
                showToast("Please enter your name first!");
                userNameInput.focus();
                return;
            }

            // UI Loading State
            generateBtn.disabled = true;
            btnLoader.style.display = "inline-block";
            btnText.textContent = "Generating...";

            let imageUrl = null;
            const file = userPhotoInput.files[0];

            try {
                if (file) {
                    btnText.textContent = "Uploading Photo...";
                    imageUrl = await uploadToImgBB(file);
                }

                btnText.textContent = "Saving Greeting...";
                const eid = await saveToDatabase(name, imageUrl);

                setupResult(name, imageUrl, eid, false);
                showToast("Greeting Created Successfully!", true);

            } catch (error) {
                showToast(error.message);
            } finally {
                generateBtn.disabled = false;
                btnLoader.style.display = "none";
                btnText.textContent = "✨ Generate Eid Wish";
            }
        };

        // --- Logic: Render the Card ---
        function setupResult(name, imageUrl, eid, isViewing) {
            inputSection.style.display = 'none';
            resultSection.style.display = 'block';

            // Set Image
            if (imageUrl) {
                displayImage.src = imageUrl;
                displayImage.style.display = 'block';
            } else {
                displayImage.style.display = 'none';
            }

            // Set Texts
            finalMessage.innerHTML = `Eid Mubarak from <span style="color: var(--primary); font-weight: bold;">${name}</span>! 🎉<br>تَقَبَّلَ اللهُ مِنَّا وَ مِنْكُمْ`;
            bengaliMessage.innerHTML = `<span style="color: var(--primary); font-weight: bold;">${name}</span> আপনাকে ঈদ উল ফিতরের শুভেচ্ছা জানিয়েছে 🌙`;

            // Setup the share URL
            const cleanOriginUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${cleanOriginUrl}?eid=${eid}`;
            
            const plainTextMsg = `✨ Eid Mubarak from ${name}! 🎉 تَقَبَّلَ اللهُ مِنَّا وَ مِنْكُمْ\n${name} আপনাকে ঈদ উল ফিতরের শুভেচ্ছা জানিয়েছে 🌙\n\nClick here to see the greeting 👇\n${shareUrl}`;
            
            const encodedMsg = encodeURIComponent(plainTextMsg);
            const encodedUrl = encodeURIComponent(shareUrl);

            // Update Social Links
            document.getElementById('shareWa').href = `whatsapp://send?text=${encodedMsg}`;
            document.getElementById('shareMs').href = `fb-messenger://share/?link=${encodedUrl}`;
            document.getElementById('shareTg').href = `https://t.me/share/url?url=${encodedUrl}&text=${encodeURIComponent(`Eid Mubarak from ${name}! 🎉`)}`;
            
            // IMO Native URI
            const imoBtn = document.getElementById('shareImo');
            imoBtn.onclick = (e) => {
                e.preventDefault();
                window.location.href = `imo://share?text=${encodedMsg}`;
                setTimeout(() => {
                    if (navigator.share) {
                        navigator.share({ title: 'Eid Mubarak!', text: plainTextMsg, url: shareUrl }).catch(console.error);
                    }
                }, 500);
            };

            // Copy Link Functionality
            const copyBtn = document.getElementById('copyLinkBtn');
            copyBtn.onclick = () => {
                if(navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl)
                        .then(() => showToast("Link copied to clipboard!", true))
                        .catch(() => fallbackCopyTextToClipboard(shareUrl));
                } else {
                    fallbackCopyTextToClipboard(shareUrl);
                }
            };

            // Visibility for Viral Loop buttons
            if (isViewing) {
                createOwnBtn.style.display = 'block';
            } else {
                createOwnBtn.style.display = 'none';
                // Update browser URL without reloading so they can copy it from the address bar
                window.history.pushState({}, '', `?eid=${eid}`);
            }

            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // --- Utilities ---
        window.resetToCreate = function() {
            resultSection.style.display = 'none';
            inputSection.style.display = 'block';
            userNameInput.value = '';
            userPhotoInput.value = '';
            fileNameDisplay.textContent = 'No file chosen';
            fileNameDisplay.style.color = '#aaa';
            
            // Remove ?eid from URL without reload
            window.history.pushState({}, '', window.location.pathname);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Link copied to clipboard!", true);
            } catch (err) {
                showToast("Failed to copy link.");
            }
            document.body.removeChild(textArea);
        }
    </script>
</body>
</html>
