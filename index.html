<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Eid Mubarak ✨</title>
    <meta name="theme-color" content="#1e1b4b">
    
    <style>
        /* === CSS Variables & Reset === */
        :root {
            --primary: #facc15;
            --secondary: #fb923c;
            --bg-dark: #0f172a;
            --bg-light: #1e1b4b;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* === CSS Animated Stars Background === */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
        }

        /* === Main Container (Glassmorphism) === */
        .container {
            width: 90%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: slideUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* === Top GIF === */
        .header-gif {
            width: 100%;
            max-width: 250px;
            border-radius: 16px;
            margin: 0 auto 1.5rem;
            display: block;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
        }

        /* === Typography & Neon Text === */
        .greeting-text {
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary), #f472b6);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 15px rgba(250, 204, 21, 0.3); }
            50% { text-shadow: 0 0 25px rgba(250, 204, 21, 0.6); }
        }

        /* === Input Field === */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .name-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 50px;
            border: 2px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.3);
        }
        
        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        /* === Buttons === */
        .btn-generate {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
        }

        .btn-generate:hover, .btn-generate:active {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            transform: scale(0.98);
        }

        /* === Generated Message Area === */
        #result-area {
            display: none;
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-in;
        }

        .custom-message {
            background: rgba(250, 204, 21, 0.1);
            border: 1px dashed var(--primary);
            padding: 1.5rem;
            border-radius: 16px;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        #dynamic-name {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.4rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === Share Buttons === */
        .share-text {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .share-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: white;
        }

        .share-btn svg { width: 24px; height: 24px; fill: white; }
        
        .share-btn:hover, .share-btn:active {
            transform: translateY(-5px) scale(1.05);
        }

        .bg-whatsapp { background: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
        .bg-messenger { background: #0084FF; box-shadow: 0 4px 15px rgba(0, 132, 255, 0.4); }
        .bg-facebook { background: #1877F2; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4); }
        .bg-imo { background: #00A3E0; box-shadow: 0 4px 15px rgba(0, 163, 224, 0.4); } /* IMO Blue */

        /* === Audio Controller === */
        .audio-controller {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .audio-controller:active {
            transform: scale(0.9);
        }

        .music-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: ripple 1.5s linear infinite;
            opacity: 0;
        }

        .playing .music-waves { opacity: 1; }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Starry Background generated by JS -->
    <div class="stars" id="stars-container"></div>

    <!-- Background Audio -->
    <audio id="bg-music" src="song.mp3" loop autoplay></audio>

    <!-- Audio Play/Mute Toggle -->
    <div class="audio-controller" id="audio-toggle" onclick="toggleAudio()">
        <span class="music-waves"></span>
        <span id="audio-icon">🔇</span>
    </div>

    <div class="container">
        <!-- Top Image -->
        <img src="eid.gif" alt="Eid Mubarak" class="header-gif" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'250\' height=\'150\'><rect width=\'100%\' height=\'100%\' fill=\'%231e1b4b\'/><text x=\'50%\' y=\'50%\' fill=\'%23facc15\' font-size=\'20\' text-anchor=\'middle\' dominant-baseline=\'middle\'>Eid Mubarak Image</text></svg>';">

        <!-- Greeting Text -->
        <p class="greeting-text">
            ✨ Eid Mubarak! May this Eid bring joy, peace, and prosperity to all! ✨
        </p>

        <!-- Input Section -->
        <div class="input-group">
            <input type="text" id="userName" class="name-input" placeholder="Enter Your Name..." autocomplete="off">
        </div>

        <button class="btn-generate" onclick="generateWish()">
            Generate Eid Wish
        </button>

        <!-- Result & Sharing Area (Hidden initially) -->
        <div id="result-area">
            <div class="custom-message">
                Eid Mubarak from <br><span id="dynamic-name">[Name]</span>! 🎉<br> Wishing you happiness and blessings!
            </div>

            <p class="share-text">Share your wish with friends & family:</p>
            
            <div class="share-buttons">
                <!-- WhatsApp -->
                <button class="share-btn bg-whatsapp" onclick="shareTo('whatsapp')" aria-label="Share on WhatsApp">
                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                </button>
                
                <!-- Messenger -->
                <button class="share-btn bg-messenger" onclick="shareTo('messenger')" aria-label="Share on Messenger">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.258c0 2.9 1.458 5.485 3.748 7.155v3.316c0 .408.438.653.791.439l3.522-2.14a10.864 10.864 0 0 0 1.939.174c5.523 0 10-4.145 10-9.258C22 6.145 17.523 2 12 2zm1.18 10.454l-2.618-2.793a.747.747 0 0 0-1.077-.024l-3.327 3.55c-.296.316.14.78.508.544l2.645-1.7a.75.75 0 0 1 .91.042l2.617 2.794a.748.748 0 0 0 1.076.023l3.327-3.55c.296-.316-.14-.78-.508-.543l-2.645 1.7a.75.75 0 0 1-.91-.043z"/></svg>
                </button>

                <!-- Facebook -->
                <button class="share-btn bg-facebook" onclick="shareTo('facebook')" aria-label="Share on Facebook">
                    <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </button>

                <!-- IMO -->
                <button class="share-btn bg-imo" onclick="shareTo('imo')" aria-label="Share on IMO">
                    <!-- Custom SVG representing Chat/IMO -->
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.63.39 3.17 1.08 4.56L2.1 21.9l5.48-.95C8.93 21.62 10.42 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm-2.5 11.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript logic -->
    <script>
        // --- 1. Audio Logic (Handle Autoplay Policies) ---
        const audio = document.getElementById('bg-music');
        const audioIcon = document.getElementById('audio-icon');
        const audioToggle = document.getElementById('audio-toggle');
        let isPlaying = false;

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    audioIcon.textContent = '🔊';
                    audioToggle.classList.add('playing');
                }).catch(e => console.log("Audio play failed:", e));
            } else {
                audio.pause();
                isPlaying = false;
                audioIcon.textContent = '🔇';
                audioToggle.classList.remove('playing');
            }
        }

        // Try to play immediately if browser allows, otherwise wait for first interaction
        window.addEventListener('DOMContentLoaded', () => {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    audioIcon.textContent = '🔊';
                    audioToggle.classList.add('playing');
                }).catch(() => {
                    // Autoplay blocked. Require interaction.
                    audioIcon.textContent = '🔇';
                    document.body.addEventListener('click', function unlockAudio() {
                        if (!isPlaying) toggleAudio();
                        document.body.removeEventListener('click', unlockAudio);
                    }, { once: true });
                });
            }
        });

        // --- 2. Generate Wish Logic ---
        let currentMessage = "";

        function generateWish() {
            const nameInput = document.getElementById('userName');
            const resultArea = document.getElementById('result-area');
            const dynamicName = document.getElementById('dynamic-name');
            
            let name = nameInput.value.trim();
            if (name === "") {
                name = "A Friend"; // Fallback if empty
            }

            // Update UI
            dynamicName.textContent = name;
            resultArea.style.display = 'block';

            // Prepare shareable message
            currentMessage = `Eid Mubarak from ${name}! 🎉 Wishing you happiness and blessings!`;
            
            // Smooth scroll down to result
            setTimeout(() => {
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // --- 3. Share Logic ---
        function shareTo(platform) {
            const url = window.location.href; // Current site link
            const text = currentMessage || "✨ Eid Mubarak! May this Eid bring joy, peace, and prosperity to all! ✨";
            
            const encodedText = encodeURIComponent(text + "\n\nSee my wish here: " + url);
            const encodedUrl = encodeURIComponent(url);
            
            let shareLink = "";

            switch (platform) {
                case 'whatsapp':
                    // Works perfectly on mobile and web
                    shareLink = `https://api.whatsapp.com/send?text=${encodedText}`;
                    break;
                    
                case 'facebook':
                    // Facebook prefers just URL for sharing. Quotes/text are often ignored by FB's API now, but we pass it anyway.
                    shareLink = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}&quote=${encodeURIComponent(text)}`;
                    break;
                    
                case 'messenger':
                    // Messenger deep link for mobile devices
                    shareLink = `fb-messenger://share/?link=${encodedUrl}`;
                    break;
                    
                case 'imo':
                    // IMO intent for Android, falls back to native Web Share API for iOS/others if supported
                    if (navigator.share) {
                        navigator.share({
                            title: 'Eid Mubarak!',
                            text: text,
                            url: url
                        }).catch(console.error);
                        return; // Prevent window.open
                    } else {
                        // Fallback intent for Android IMO app
                        shareLink = `intent://share/?text=${encodedText}#Intent;action=android.intent.action.SEND;type=text/plain;package=com.imo.android.imoim;scheme=imo;end;`;
                    }
                    break;
            }

            if (shareLink) {
                // Open share window in a new tab/app intent
                window.open(shareLink, '_blank');
            }
        }

        // --- 4. Generate Starry Background ---
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 50; // Adjust for density
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Randomize position, size, and animation delay
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = Math.random() * 3 + 1; // 1px to 4px
                const delay = Math.random() * 3; // 0s to 3s
                const duration = Math.random() * 2 + 1; // 1s to 3s

                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.animationDelay = `${delay}s`;
                star.style.animationDuration = `${duration}s`;
                
                container.appendChild(star);
            }
        }
        
        // Initialize Stars
        createStars();

    </script>
</body>
</html>
